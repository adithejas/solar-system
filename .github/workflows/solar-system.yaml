name: Solar System Tests

on:
 workflow_dispatch:
  push:
    branches:
      - main
      - "feature/*"

jobs:
    unit-tests:
        name: Run Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run unit tests
              run: npm test